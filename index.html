<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubble Reef</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800&display=swap">
<style>
/* Layout: one-screen arcade tank. HUD strip on top, tall portrait water tank with menus floating in it, one hint line below. */
:root {
  --abyss: #06202b;
  --panel: #0b2f3c;
  --line: #134d60;
  --foam: #e8fbff;
  --muted: #86b7c4;
  --glow: #ffc145;
  --glow-deep: #b9801a;
  --scrim: rgba(3, 16, 22, 0.8);
  --font-display: "Bungee", "Arial Black", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--abyss);
  color: var(--foam);
  font-family: var(--font-body);
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.cabinet {
  width: min(100%, max(240px, calc((100vh - 140px) * 0.6286)));
  width: min(100%, max(240px, calc((100dvh - 140px) * 0.6286)));
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}
.hud { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(1rem, 4.4vw, 1.4rem);
  line-height: 1;
  margin: 0;
  color: var(--foam);
  text-shadow: 0 2px 0 #0e4558;
}
.hud-right { display: flex; align-items: flex-end; gap: 12px; }
.stats { display: flex; gap: 12px; }
.stat { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.stat span {
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.stat b {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
  color: var(--glow);
}
.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 0;
  background: var(--panel);
  box-shadow: inset 0 0 0 2px var(--line);
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.icon-btn i { display: flex; gap: 4px; }
.icon-btn i::before, .icon-btn i::after { content: ""; width: 4px; height: 12px; border-radius: 2px; background: var(--foam); }
.icon-btn:focus-visible, .btn:focus-visible, .diff:focus-visible, .switch:focus-visible, input:focus-visible {
  outline: 3px solid var(--foam);
  outline-offset: 3px;
}
.tank {
  position: relative;
  width: 100%;
  aspect-ratio: 352 / 560;
  max-width: 100%;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 0 0 2px var(--line), 0 18px 40px rgba(0, 0, 0, 0.45);
}
canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.overlay {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  background: var(--scrim);
  overflow-y: auto;
}
.screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  width: 100%;
}
.screen h2 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 1.5rem;
  line-height: 1.1;
  margin: 0;
  color: var(--glow);
  text-wrap: balance;
}
.screen h2.logo {
  font-size: clamp(2.2rem, 11vw, 3rem);
  line-height: 0.95;
  color: var(--foam);
  text-shadow: 0 4px 0 #0e4558, 0 0 24px rgba(60, 200, 232, 0.35);
}
.screen p { margin: 0; max-width: 26ch; line-height: 1.45; }
.tagline { color: var(--muted); font-size: 0.85rem; }
.small { color: var(--muted); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-direction: column; gap: 10px; width: min(100%, 220px); }
.stack.wide { width: min(100%, 290px); }
.btn {
  font-family: var(--font-display);
  font-size: 1rem;
  border: 0;
  border-radius: 999px;
  padding: 12px 22px;
  background: var(--panel);
  color: var(--foam);
  box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 #041a22;
  cursor: pointer;
}
.btn.primary { background: var(--glow); color: var(--abyss); box-shadow: 0 4px 0 var(--glow-deep); }
.btn.ghost { background: transparent; box-shadow: none; color: var(--muted); font-size: 0.85rem; padding: 8px 16px; }
.btn:active { transform: translateY(2px); }
.diff {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  text-align: left;
  padding: 12px 16px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--panel);
  color: var(--foam);
  font-family: var(--font-body);
  cursor: pointer;
}
.diff:hover { border-color: var(--glow); }
.diff b { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; display: flex; gap: 8px; align-items: center; }
.diff b em { font-style: normal; color: var(--glow); letter-spacing: 2px; font-size: 0.8rem; }
.diff span { font-size: 0.78rem; color: var(--muted); line-height: 1.35; }
.settings { display: flex; flex-direction: column; gap: 14px; width: min(100%, 270px); }
.setting { display: flex; align-items: center; justify-content: space-between; gap: 16px; font-weight: 700; }
.switch {
  position: relative;
  width: 48px;
  height: 28px;
  border-radius: 999px;
  border: 0;
  background: var(--line);
  cursor: pointer;
  flex: none;
  transition: background 0.15s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 4px;
  left: 4px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--foam);
  transition: transform 0.15s;
}
.switch[aria-checked="true"] { background: var(--glow); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--abyss); }
input[type="range"] { width: 130px; accent-color: var(--glow); }
.hint { margin: 0; font-size: 0.78rem; line-height: 1.4; color: var(--muted); text-align: center; }
.hint kbd {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 0.7rem;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--panel);
  color: var(--foam);
}
@media (prefers-reduced-motion: reduce) {
  .switch, .switch::after { transition: none; }
}
</style>

<div class="cabinet">
  <header class="hud">
    <h1>Bubble Reef</h1>
    <div class="hud-right">
      <div class="stats">
        <div class="stat"><span>Level</span><b id="level">1</b></div>
        <div class="stat"><span>Score</span><b id="score">0</b></div>
        <div class="stat"><span>Best</span><b id="best">0</b></div>
      </div>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause"><i></i></button>
    </div>
  </header>
  <div class="tank">
    <canvas id="game" aria-label="Bubble shooter board"></canvas>
    <div class="overlay" id="overlay">
      <section class="screen" id="scr-main">
        <h2 class="logo">Bubble<br>Reef</h2>
        <p class="tagline">Pop the reef before it floods.</p>
        <div class="stack">
          <button class="btn primary" id="btnPlay" type="button">Play</button>
          <button class="btn" id="btnSettings" type="button">Settings</button>
        </div>
        <p class="small" id="bestLine"></p>
      </section>

      <section class="screen" id="scr-diff" hidden>
        <h2>Choose difficulty</h2>
        <div class="stack wide">
          <button class="diff" type="button" data-diff="easy"><b>Easy <em>●○○</em></b><span>3 colors, 8 shots before a new row, full aim line</span></button>
          <button class="diff" type="button" data-diff="normal"><b>Normal <em>●●○</em></b><span>4 colors, 6 shots before a new row, 1.5× points</span></button>
          <button class="diff" type="button" data-diff="hard"><b>Hard <em>●●●</em></b><span>5 colors, 4 shots before a new row, short aim line, 2× points</span></button>
        </div>
        <button class="btn ghost" id="diffBack" type="button">Back</button>
      </section>

      <section class="screen" id="scr-settings" hidden>
        <h2>Settings</h2>
        <div class="settings">
          <div class="setting"><span id="lblSound">Sound effects</span><button class="switch" id="tSound" type="button" role="switch" aria-labelledby="lblSound" aria-checked="true"></button></div>
          <div class="setting"><span id="lblMusic">Music</span><button class="switch" id="tMusic" type="button" role="switch" aria-labelledby="lblMusic" aria-checked="true"></button></div>
          <div class="setting"><label for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="70"></div>
        </div>
        <button class="btn ghost" id="settingsBack" type="button">Back</button>
      </section>

      <section class="screen" id="scr-pause" hidden>
        <h2>Paused</h2>
        <div class="stack">
          <button class="btn primary" id="btnResume" type="button">Resume</button>
          <button class="btn" id="btnPauseSettings" type="button">Settings</button>
          <button class="btn" id="btnQuit" type="button">Quit to menu</button>
        </div>
      </section>

      <section class="screen" id="scr-result" hidden>
        <h2 id="resTitle">Reef cleared</h2>
        <p id="resText"></p>
        <div class="stack">
          <button class="btn primary" id="resBtn" type="button">Next level</button>
          <button class="btn" id="resMenu" type="button">Main menu</button>
        </div>
      </section>
    </div>
  </div>
  <p class="hint">Aim and release to shoot. Match 3 to pop. Tap the small bubble to swap.
    <br><kbd>←</kbd> <kbd>→</kbd> aim · <kbd>Space</kbd> shoot · <kbd>X</kbd> swap · <kbd>Esc</kbd> pause</p>
</div>

<script>
(() => {
  const W = 352, H = 560, R = 16, D = 32, COLS = 11;
  const ROW_H = R * Math.sqrt(3);
  const MAX_ROWS = 17, DEATH_ROW = 16;
  const SHOOT_X = W / 2, SHOOT_Y = 506, SPEED = 1100;
  const NEXT_X = SHOOT_X - 76, NEXT_Y = SHOOT_Y + 22;
  const MIN_A = 0.13, MAX_A = Math.PI - 0.13;
  const COLORS = [
    { base: '#ff6b6b', dark: '#a82a35', glyph: 'dot' },
    { base: '#ffc145', dark: '#b07614', glyph: 'tri' },
    { base: '#4fd18b', dark: '#1b7c4b', glyph: 'square' },
    { base: '#3cc8e8', dark: '#156f8d', glyph: 'diamond' },
    { base: '#a283ff', dark: '#5534b8', glyph: 'plus' },
    { base: '#ff85cf', dark: '#a8337c', glyph: 'ring' },
  ];
  const DIFFS = {
    easy:   { label: 'Easy',   colors: 3, shots: 8, rows: 4, guide: 220, mult: 1 },
    normal: { label: 'Normal', colors: 4, shots: 6, rows: 5, guide: 220, mult: 1.5 },
    hard:   { label: 'Hard',   colors: 5, shots: 4, rows: 6, guide: 70,  mult: 2 },
  };
  const SHAPES = {
    full: 'Full reef', vee: 'Funnel', hourglass: 'Hourglass', pillars: 'Pillars',
    holes: 'Coral holes', diamond: 'Diamond', steps: 'Staircase', wave: 'Wave',
  };
  const PATTERNS = {
    clusters: 'Clusters', stripes: 'Stripes', diagonal: 'Diagonals',
    columns: 'Columns', scatter: 'Scatter', rings: 'Rings',
  };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const overlay = $('overlay');

  let grid = [], parity = 0, score = 0, level = 1, misses = 0, cur = 0, next = 1;
  let angle = Math.PI / 2, shot = null, falling = [], effects = [], popups = [], banner = null;
  let state = 'menu', rowAnim = 0, scale = 1, sprites = [];
  let diffKey = 'normal', levelColors = [0, 1, 2, 3];
  let pointerDown = false, settingsReturn = 'main';
  const keys = {};
  const rand = n => (Math.random() * n) | 0;
  const pick = arr => arr[rand(arr.length)];

  // ---------- saved data ----------
  let bests = { easy: 0, normal: 0, hard: 0 };
  let settings = { sound: true, music: true, volume: 70 };
  try { Object.assign(bests, JSON.parse(localStorage.getItem('bubble-reef-bests') || '{}')); } catch (e) {}
  try { Object.assign(settings, JSON.parse(localStorage.getItem('bubble-reef-settings') || '{}')); } catch (e) {}
  const saveBests = () => { try { localStorage.setItem('bubble-reef-bests', JSON.stringify(bests)); } catch (e) {} };
  const saveSettings = () => { try { localStorage.setItem('bubble-reef-settings', JSON.stringify(settings)); } catch (e) {} };

  // ---------- audio ----------
  const audio = { ctx: null };
  const STEP = 60 / 92 / 2; // eighth notes at 92 bpm
  const PROG = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am F C G
  const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
  let mStep = 0, mNext = 0;

  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (audio.ctx) { if (audio.ctx.state === 'suspended') audio.ctx.resume(); return; }
    const c = new AC();
    audio.ctx = c;
    audio.master = c.createGain(); audio.master.connect(c.destination);
    audio.sfx = c.createGain(); audio.sfx.connect(audio.master);
    audio.music = c.createGain(); audio.music.connect(audio.master);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; lp.connect(audio.music);
    const echo = c.createDelay(); echo.delayTime.value = STEP * 3;
    const fb = c.createGain(); fb.gain.value = 0.32;
    echo.connect(fb); fb.connect(echo); echo.connect(lp);
    audio.musicIn = lp; audio.echo = echo;
    applyAudio();
    mNext = c.currentTime + 0.15;
    setInterval(scheduleMusic, 25);
  }

  function applyAudio() {
    if (!audio.ctx) return;
    const t = audio.ctx.currentTime;
    audio.master.gain.setTargetAtTime(settings.volume / 100, t, 0.05);
    audio.sfx.gain.setTargetAtTime(settings.sound ? 1 : 0, t, 0.03);
    audio.music.gain.setTargetAtTime(settings.music ? 0.6 : 0, t, 0.25);
  }

  function tone({ freq, to, type = 'sine', dur = 0.12, vol = 0.2, delay = 0, attack = 0.005 }) {
    if (!audio.ctx || !settings.sound || audio.ctx.state !== 'running') return;
    const c = audio.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.sfx);
    o.start(t); o.stop(t + dur + 0.02);
  }

  const sfx = {
    shoot: () => tone({ freq: 320, to: 760, type: 'triangle', dur: 0.12, vol: 0.14 }),
    bounce: () => tone({ freq: 1100, type: 'sine', dur: 0.04, vol: 0.05 }),
    stick: () => tone({ freq: 200, to: 120, type: 'sine', dur: 0.09, vol: 0.2 }),
    pop: i => tone({ freq: 480 + Math.random() * 420, to: 1500, type: 'sine', dur: 0.08, vol: 0.13, delay: i * 0.03 }),
    drop: i => tone({ freq: 760, to: 190, type: 'triangle', dur: 0.28, vol: 0.07, delay: 0.15 + i * 0.05 }),
    row: () => tone({ freq: 120, to: 50, type: 'sine', dur: 0.4, vol: 0.32 }),
    swap: () => tone({ freq: 440, to: 600, type: 'sine', dur: 0.07, vol: 0.1 }),
    click: () => tone({ freq: 700, type: 'sine', dur: 0.05, vol: 0.08 }),
    clear: () => [523, 659, 784, 1047].forEach((f, i) => tone({ freq: f, type: 'triangle', dur: 0.3, vol: 0.14, delay: i * 0.1 })),
    over: () => [392, 330, 262, 196].forEach((f, i) => tone({ freq: f, type: 'triangle', dur: 0.4, vol: 0.14, delay: i * 0.17 })),
  };

  function musicNote(f, t, dur, type, vol, attack, wet) {
    const c = audio.ctx;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audio.musicIn);
    if (wet) g.connect(audio.echo);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function scheduleMusic() {
    const c = audio.ctx;
    if (!c || c.state !== 'running') return;
    if (!settings.music || settings.volume === 0) { mNext = c.currentTime + 0.1; return; }
    if (mNext < c.currentTime) mNext = c.currentTime + 0.05;
    while (mNext < c.currentTime + 0.15) {
      const bar = Math.floor(mStep / 8) % 4, beat = mStep % 8, chord = PROG[bar];
      if (beat === 0) {
        chord.forEach(n => musicNote(NOTE(n), mNext, STEP * 8.5, 'sine', 0.04, 0.5, false));
        musicNote(NOTE(chord[0] - 12), mNext, STEP * 3, 'triangle', 0.11, 0.01, false);
      }
      if (beat === 4) musicNote(NOTE(chord[0] - 12), mNext, STEP * 3, 'triangle', 0.09, 0.01, false);
      if (Math.random() < (beat % 2 ? 0.45 : 0.8)) {
        const n = pick([chord[0] + 12, chord[1] + 12, chord[2] + 12, chord[0] + 24]);
        musicNote(NOTE(n), mNext, STEP * 1.8, 'sine', 0.05, 0.005, true);
      }
      mNext += STEP;
      mStep = (mStep + 1) % 32;
    }
  }

  addEventListener('pointerdown', initAudio, { capture: true });
  addEventListener('keydown', initAudio, { capture: true });
  document.addEventListener('visibilitychange', () => {
    if (!audio.ctx) return;
    if (document.hidden) audio.ctx.suspend(); else audio.ctx.resume();
  });

  // ---------- grid helpers ----------
  const isOff = r => ((r + parity) & 1) === 1;
  const rowLen = r => (isOff(r) ? COLS - 1 : COLS);
  const cx = (r, c) => R + c * D + (isOff(r) ? R : 0);
  const cy = r => R + r * ROW_H;
  const diff = () => DIFFS[diffKey];
  const shotsPerRow = () => Math.max(2, diff().shots - Math.floor((level - 1) / 2));
  const numColors = () => Math.min(diff().colors + Math.floor((level - 1) / 2), COLORS.length);

  function neighbors(r, c) {
    const cols = isOff(r) ? [c, c + 1] : [c - 1, c];
    const list = [[r, c - 1], [r, c + 1]];
    for (const rr of [r - 1, r + 1]) for (const cc of cols) list.push([rr, cc]);
    return list.filter(([rr, cc]) => rr >= 0 && rr < MAX_ROWS && cc >= 0 && cc < grid[rr].length);
  }

  function flood(r, c, pred, seen = new Set()) {
    const out = [];
    const k0 = r * 100 + c;
    if (seen.has(k0) || !pred(r, c)) return out;
    seen.add(k0);
    const stack = [[r, c]];
    while (stack.length) {
      const [a, b] = stack.pop();
      out.push([a, b]);
      for (const [na, nb] of neighbors(a, b)) {
        const k = na * 100 + nb;
        if (!seen.has(k) && pred(na, nb)) { seen.add(k); stack.push([na, nb]); }
      }
    }
    return out;
  }

  // removes every bubble not hanging from the top row; returns the removed cells
  function cutFloating() {
    const connected = new Set();
    for (let c = 0; c < grid[0].length; c++) flood(0, c, (a, b) => grid[a][b] >= 0, connected);
    const out = [];
    for (let a = 0; a < MAX_ROWS; a++) {
      for (let b = 0; b < grid[a].length; b++) {
        if (grid[a][b] >= 0 && !connected.has(a * 100 + b)) { out.push([a, b, grid[a][b]]); grid[a][b] = -1; }
      }
    }
    return out;
  }

  function boardColors() {
    const s = new Set();
    for (const row of grid) for (const v of row) if (v >= 0) s.add(v);
    return [...s];
  }
  function pickColor() {
    const cs = boardColors();
    return cs.length ? pick(cs) : pick(levelColors);
  }
  const countBubbles = () => grid.reduce((n, row) => n + row.filter(v => v >= 0).length, 0);

  // ---------- random level generator ----------
  function inShape(shape, r, c, rows, seed) {
    const u = (cx(r, c) - R) / (W - 2 * R); // 0..1 across
    const v = rows > 1 ? r / (rows - 1) : 0; // 0..1 down
    const d = Math.abs(u - 0.5);
    switch (shape) {
      case 'vee': return d < 0.52 - v * 0.36;
      case 'hourglass': return d < 0.52 - 0.32 * Math.sin(Math.PI * v);
      case 'pillars': return r < 2 || [0.12, 0.5, 0.88].some(p => Math.abs(u - p) < 0.13);
      case 'holes': return r === 0 || Math.random() > 0.2;
      case 'diamond': return r === 0 || d < 0.12 + 0.4 * (1 - Math.abs(2 * v - 1));
      case 'steps': return v <= 0.35 + 0.65 * (((Math.floor(u * 4) + seed) % 4) / 3);
      case 'wave': return v <= 0.55 + 0.45 * Math.sin((u * 2 + seed * 0.25) * Math.PI);
      default: return true;
    }
  }

  function generateLevel() {
    const n = numColors();
    levelColors = [0, 1, 2, 3, 4, 5].sort(() => Math.random() - 0.5).slice(0, n);
    const baseRows = diff().rows + Math.floor((level - 1) / 2);
    const rows = Math.min(baseRows + rand(3), 11);
    const shape = level === 1 ? pick(['full', 'full', 'wave', 'vee']) : pick(Object.keys(SHAPES));
    const pattern = pick(Object.keys(PATTERNS));
    const seed = rand(4);
    const noise = 0.12 + Math.random() * 0.1;

    for (let attempt = 0; attempt < 6; attempt++) {
      parity = rand(2);
      grid = [];
      for (let r = 0; r < MAX_ROWS; r++) grid.push(new Array(rowLen(r)).fill(-1));
      const useShape = attempt < 4 ? shape : 'full';
      const rowBand = Array.from({ length: rows }, () => pick(levelColors));
      const bandH = 1 + rand(2);
      const colBands = Array.from({ length: 6 }, () => pick(levelColors));
      const colW = 2 + rand(2);
      const ringX = Math.random() * W, ringY = Math.random() * rows * ROW_H;
      const dir = Math.random() < 0.5 ? 1 : -1;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < grid[r].length; c++) {
          if (!inShape(useShape, r, c, rows, seed)) continue;
          let col;
          switch (pattern) {
            case 'stripes': col = rowBand[Math.floor(r / bandH) % rows]; break;
            case 'columns': col = colBands[Math.floor(c / colW) % colBands.length]; break;
            case 'diagonal': col = levelColors[(((r + dir * Math.floor(c / 1.5)) % n) + n * 4) % n]; break;
            case 'rings': col = levelColors[Math.floor(Math.hypot(cx(r, c) - ringX, cy(r) - ringY) / (D * 1.4)) % n]; break;
            case 'scatter': col = pick(levelColors); break;
            default: {
              const ns = neighbors(r, c).filter(([a, b]) => grid[a][b] >= 0);
              col = ns.length && Math.random() < 0.5 ? grid[ns[0][0]][ns[0][1]] : pick(levelColors);
              if (ns.length && Math.random() < 0.5) { const [a, b] = pick(ns); col = grid[a][b]; }
            }
          }
          if (pattern !== 'scatter' && pattern !== 'clusters' && Math.random() < noise) col = pick(levelColors);
          grid[r][c] = col;
        }
      }
      cutFloating();
      if (countBubbles() >= 14 && boardColors().length >= Math.min(2, n)) {
        return `${SHAPES[useShape]} · ${PATTERNS[pattern]}`;
      }
    }
    return 'Full reef';
  }

  function setupLevel() {
    const name = generateLevel();
    misses = 0; shot = null; falling = []; effects = []; popups = []; rowAnim = 0;
    cur = pickColor(); next = pickColor();
    banner = { title: 'Level ' + level, sub: name, t: 0 };
    updateHud();
  }

  function startGame(key) {
    diffKey = key;
    score = 0; level = 1;
    setupLevel();
    state = 'play';
    showScreen(null);
  }

  // ---------- gameplay ----------
  function collides(x, y) {
    if (y <= R) return true;
    const r0 = Math.max(0, Math.floor((y - R) / ROW_H) - 1);
    const lim = (D * 0.82) ** 2;
    for (let r = r0; r <= Math.min(MAX_ROWS - 1, r0 + 3); r++) {
      const row = grid[r], yy = cy(r);
      for (let c = 0; c < row.length; c++) {
        if (row[c] >= 0 && (cx(r, c) - x) ** 2 + (yy - y) ** 2 < lim) return true;
      }
    }
    return false;
  }

  function fire() {
    if (state !== 'play' || shot) return;
    shot = { x: SHOOT_X, y: SHOOT_Y, vx: Math.cos(angle) * SPEED, vy: -Math.sin(angle) * SPEED, c: cur };
    cur = next;
    next = pickColor();
    sfx.shoot();
  }

  function swap() {
    if (state !== 'play') return;
    [cur, next] = [next, cur];
    sfx.swap();
  }

  function stepShot(dt) {
    const steps = Math.ceil((SPEED * dt) / 4);
    for (let i = 0; i < steps; i++) {
      shot.x += (shot.vx * dt) / steps;
      shot.y += (shot.vy * dt) / steps;
      if (shot.x < R) { shot.x = 2 * R - shot.x; shot.vx = -shot.vx; sfx.bounce(); }
      if (shot.x > W - R) { shot.x = 2 * (W - R) - shot.x; shot.vx = -shot.vx; sfx.bounce(); }
      if (collides(shot.x, shot.y)) { land(); return; }
    }
  }

  function land() {
    const { x, y, c } = shot;
    shot = null;
    let spot = null, bd = Infinity;
    const rc = Math.round((y - R) / ROW_H);
    for (let r = Math.max(0, rc - 1); r <= Math.min(MAX_ROWS - 1, rc + 1); r++) {
      for (let cc = 0; cc < grid[r].length; cc++) {
        if (grid[r][cc] >= 0) continue;
        const d = (cx(r, cc) - x) ** 2 + (cy(r) - y) ** 2;
        if (d < bd) { bd = d; spot = [r, cc]; }
      }
    }
    if (!spot) { endGame(); return; }
    const [r, cc] = spot;
    grid[r][cc] = c;
    resolve(r, cc, c);
  }

  function resolve(r, c, col) {
    const group = flood(r, c, (a, b) => grid[a][b] === col);
    if (group.length >= 3) {
      group.forEach(([a, b], i) => {
        spawnPop(cx(a, b), cy(a), grid[a][b], i * 0.03);
        if (i < 8) sfx.pop(i);
        grid[a][b] = -1;
      });
      const loose = cutFloating();
      loose.forEach(([a, b, v], i) => {
        falling.push({ x: cx(a, b), y: cy(a), vx: (Math.random() - 0.5) * 90, vy: -40 - Math.random() * 90, c: v });
        if (i < 5) sfx.drop(i);
      });
      const gained = Math.round((group.length * 10 + loose.length * 20) * diff().mult);
      addScore(gained);
      popups.push({ x: cx(r, c), y: cy(r), text: '+' + gained, t: 0 });
    } else {
      sfx.stick();
      misses++;
      if (misses >= shotsPerRow()) { misses = 0; addRow(); }
    }

    const present = boardColors();
    if (!present.length) { levelClear(); return; }
    if (!present.includes(cur)) cur = pickColor();
    if (!present.includes(next)) next = pickColor();
    if (overLine()) endGame();
  }

  function addRow() {
    const present = boardColors();
    parity ^= 1;
    const row = Array.from({ length: rowLen(0) }, () => (present.length ? pick(present) : pick(levelColors)));
    grid.unshift(row);
    grid.pop();
    rowAnim = ROW_H;
    sfx.row();
  }

  function overLine() {
    for (let r = DEATH_ROW; r < MAX_ROWS; r++) if (grid[r].some(v => v >= 0)) return true;
    return false;
  }

  function addScore(n) {
    score += n;
    if (score > bests[diffKey]) { bests[diffKey] = score; saveBests(); }
    updateHud();
  }

  function levelClear() {
    const bonus = Math.round(250 * level * diff().mult);
    addScore(bonus);
    state = 'clear';
    sfx.clear();
    showResult('Reef cleared', `Level ${level} done on ${diff().label}. Clearing bonus +${bonus}.`, 'Next level');
  }

  function endGame() {
    state = 'over';
    sfx.over();
    const isBest = score > 0 && score >= bests[diffKey];
    showResult('The reef flooded', `Bubbles crossed the red line. You scored ${score}${isBest ? ', a new best on ' + diff().label : ''}.`, 'Play again');
  }

  function updateHud() {
    $('score').textContent = score;
    $('level').textContent = level;
    $('best').textContent = bests[diffKey];
    $('bestLine').textContent = `Best · Easy ${bests.easy} · Normal ${bests.normal} · Hard ${bests.hard}`;
  }

  // ---------- menus ----------
  const SCREENS = ['main', 'diff', 'settings', 'pause', 'result'];
  function showScreen(name) {
    overlay.hidden = !name;
    SCREENS.forEach(s => { $('scr-' + s).hidden = s !== name; });
    $('pauseBtn').hidden = state !== 'play' && state !== 'paused';
    if (name) {
      const first = $('scr-' + name).querySelector('button');
      if (first) first.focus({ preventScroll: true });
    }
  }

  function showResult(title, text, btn) {
    $('resTitle').textContent = title;
    $('resText').textContent = text;
    $('resBtn').textContent = btn;
    showScreen('result');
  }

  function goMenu() {
    state = 'menu';
    shot = null;
    updateHud();
    showScreen('main');
  }

  function pause() {
    if (state !== 'play') return;
    state = 'paused';
    pointerDown = false;
    keys.ArrowLeft = keys.ArrowRight = false;
    showScreen('pause');
  }
  function resume() {
    if (state !== 'paused') return;
    state = 'play';
    showScreen(null);
  }

  function openSettings(from) { settingsReturn = from; showScreen('settings'); }

  function syncSettingsUI() {
    $('tSound').setAttribute('aria-checked', String(settings.sound));
    $('tMusic').setAttribute('aria-checked', String(settings.music));
    $('vol').value = settings.volume;
  }

  overlay.addEventListener('click', e => { if (e.target.closest('button')) sfx.click(); });
  $('btnPlay').addEventListener('click', () => showScreen('diff'));
  $('btnSettings').addEventListener('click', () => openSettings('main'));
  $('diffBack').addEventListener('click', () => showScreen('main'));
  document.querySelectorAll('.diff').forEach(b => b.addEventListener('click', () => startGame(b.dataset.diff)));
  $('settingsBack').addEventListener('click', () => showScreen(settingsReturn));
  $('tSound').addEventListener('click', () => { settings.sound = !settings.sound; syncSettingsUI(); applyAudio(); saveSettings(); });
  $('tMusic').addEventListener('click', () => { settings.music = !settings.music; syncSettingsUI(); applyAudio(); saveSettings(); });
  $('vol').addEventListener('input', e => { settings.volume = +e.target.value; applyAudio(); saveSettings(); });
  $('btnResume').addEventListener('click', resume);
  $('btnPauseSettings').addEventListener('click', () => openSettings('pause'));
  $('btnQuit').addEventListener('click', goMenu);
  $('pauseBtn').addEventListener('click', () => (state === 'play' ? pause() : resume()));
  $('resMenu').addEventListener('click', goMenu);
  $('resBtn').addEventListener('click', () => {
    if (state === 'clear') { level++; setupLevel(); state = 'play'; showScreen(null); }
    else startGame(diffKey);
  });

  // ---------- effects ----------
  function spawnPop(x, y, c, delay) {
    effects.push({ kind: 'ring', x, y, c, t: -delay });
    for (let i = 0; i < 6; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 110;
      effects.push({ kind: 'drop', x, y, c, t: -delay, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 1.5 + Math.random() * 2 });
    }
  }

  const ambient = Array.from({ length: 16 }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: 1 + Math.random() * 2.5, s: 8 + Math.random() * 18,
  }));

  // ---------- rendering ----------
  function makeSprite(ci) {
    const size = D + 4, k = size / 2, col = COLORS[ci];
    const s = document.createElement('canvas');
    s.width = s.height = Math.ceil(size * scale);
    const c = s.getContext('2d');
    c.setTransform(scale, 0, 0, scale, 0, 0);
    const rr = R - 0.6;
    const g = c.createRadialGradient(k - 5, k - 6, 1, k, k, rr);
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.22, col.base);
    g.addColorStop(1, col.dark);
    c.beginPath(); c.arc(k, k, rr, 0, Math.PI * 2); c.fillStyle = g; c.fill();
    c.lineWidth = 1.2; c.strokeStyle = 'rgba(255,255,255,0.35)'; c.stroke();

    c.fillStyle = 'rgba(0,0,0,0.26)';
    c.strokeStyle = 'rgba(0,0,0,0.26)';
    c.beginPath();
    switch (col.glyph) {
      case 'dot': c.arc(k, k + 1, 3.6, 0, Math.PI * 2); c.fill(); break;
      case 'tri': c.moveTo(k, k - 4); c.lineTo(k + 4.8, k + 4); c.lineTo(k - 4.8, k + 4); c.closePath(); c.fill(); break;
      case 'square': c.rect(k - 3.6, k - 2.6, 7.2, 7.2); c.fill(); break;
      case 'diamond': c.moveTo(k, k - 4.6); c.lineTo(k + 4.6, k + 0.6); c.lineTo(k, k + 5.4); c.lineTo(k - 4.6, k + 0.6); c.closePath(); c.fill(); break;
      case 'plus': c.rect(k - 1.6, k - 3.8, 3.2, 9.6); c.rect(k - 4.8, k - 0.6, 9.6, 3.2); c.fill(); break;
      case 'ring': c.lineWidth = 2.2; c.arc(k, k + 1, 3.8, 0, Math.PI * 2); c.stroke(); break;
    }

    c.beginPath(); c.ellipse(k - 5.5, k - 7, 4.5, 2.6, -0.6, 0, Math.PI * 2);
    c.fillStyle = 'rgba(255,255,255,0.75)'; c.fill();
    return s;
  }

  function drawBubble(x, y, c, size = 1, alpha = 1) {
    const s = (D + 4) * size;
    ctx.globalAlpha = alpha;
    ctx.drawImage(sprites[c], x - s / 2, y - s / 2, s, s);
    ctx.globalAlpha = 1;
  }

  function resize() {
    const rect = cv.getBoundingClientRect();
    if (!rect.width) return;
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(rect.width * dpr);
    cv.height = Math.round(rect.height * dpr);
    scale = cv.width / W;
    sprites = COLORS.map((_, i) => makeSprite(i));
  }

  function drawGuide() {
    let x = SHOOT_X, y = SHOOT_Y, vx = Math.cos(angle), vy = -Math.sin(angle);
    const len = diff().guide;
    ctx.fillStyle = '#e8fbff';
    for (let i = 1; i < len; i++) {
      x += vx * 4; y += vy * 4;
      if (x < R) { x = 2 * R - x; vx = -vx; }
      if (x > W - R) { x = 2 * (W - R) - x; vx = -vx; }
      if (collides(x, y)) break;
      if (i % 4 === 0 && i > 8) {
        ctx.globalAlpha = 0.6 * (1 - i / len);
        ctx.beginPath(); ctx.arc(x, y, 2.2, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function draw(time) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0f4a5e');
    bg.addColorStop(0.7, '#082a37');
    bg.addColorStop(1, '#04141b');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(160,235,255,0.045)';
    for (let i = 0; i < 3; i++) {
      const sx = 40 + i * 120 + Math.sin(time * 0.3 + i) * 12;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx + 50, 0); ctx.lineTo(sx + 130, H); ctx.lineTo(sx + 60, H); ctx.closePath(); ctx.fill();
    }

    ctx.strokeStyle = 'rgba(200,245,255,0.18)';
    ctx.lineWidth = 1;
    for (const a of ambient) { ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.stroke(); }

    ctx.fillStyle = '#0a2630';
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, H - 34);
    ctx.quadraticCurveTo(W * 0.25, H - 58, W * 0.5, H - 46);
    ctx.quadraticCurveTo(W * 0.78, H - 34, W, H - 52);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();

    const dy = cy(DEATH_ROW) - R * 0.6;
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(255,107,107,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, dy); ctx.lineTo(W, dy); ctx.stroke();
    ctx.setLineDash([]);

    for (let r = 0; r < MAX_ROWS; r++) {
      const row = grid[r], yy = cy(r) - rowAnim;
      for (let c = 0; c < row.length; c++) if (row[c] >= 0) drawBubble(cx(r, c), yy, row[c]);
    }

    if (state === 'play' && !shot) drawGuide();

    for (const e of effects) {
      if (e.t < 0) continue;
      const col = COLORS[e.c].base;
      if (e.kind === 'ring') {
        const k = e.t / 0.3;
        ctx.globalAlpha = Math.max(0, 1 - k);
        ctx.strokeStyle = col; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(e.x, e.y, R * (0.8 + k * 0.7), 0, Math.PI * 2); ctx.stroke();
      } else {
        ctx.globalAlpha = Math.max(0, 1 - e.t / 0.45);
        ctx.fillStyle = col;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    for (const f of falling) drawBubble(f.x, f.y, f.c, 1, 0.9);
    if (shot) drawBubble(shot.x, shot.y, shot.c);

    ctx.save();
    ctx.translate(SHOOT_X, SHOOT_Y);
    ctx.rotate(-angle);
    ctx.fillStyle = '#134d60';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(0, -7, 42, 14, 7) : ctx.rect(0, -7, 42, 14); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#0c3443';
    ctx.strokeStyle = '#3cc8e8';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(SHOOT_X, SHOOT_Y, 22, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    drawBubble(SHOOT_X, SHOOT_Y, cur);

    ctx.font = '800 9px Nunito, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#86b7c4';
    ctx.fillText('NEXT', NEXT_X, NEXT_Y - 17);
    drawBubble(NEXT_X, NEXT_Y, next, 0.72);

    const total = shotsPerRow(), left = total - misses, gx = SHOOT_X + 76;
    ctx.fillStyle = '#86b7c4';
    ctx.fillText('NEW ROW IN', gx, NEXT_Y - 17);
    const gap = Math.min(10, 64 / total);
    for (let i = 0; i < total; i++) {
      const x = gx - ((total - 1) * gap) / 2 + i * gap;
      ctx.beginPath(); ctx.arc(x, NEXT_Y, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = i < left ? '#ffc145' : 'rgba(134,183,196,0.25)';
      ctx.fill();
    }

    ctx.font = '15px Bungee, "Arial Black", sans-serif';
    for (const p of popups) {
      ctx.globalAlpha = Math.max(0, 1 - p.t / 0.9);
      ctx.fillStyle = '#ffc145';
      ctx.fillText(p.text, p.x, p.y - p.t * 40);
    }
    ctx.globalAlpha = 1;

    if (banner && state === 'play') {
      const a = banner.t < 0.25 ? banner.t / 0.25 : Math.max(0, 1 - (banner.t - 1.4) / 0.4);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(3,16,22,0.6)';
      ctx.fillRect(0, H * 0.52 - 34, W, 64);
      ctx.fillStyle = '#ffc145';
      ctx.font = '26px Bungee, "Arial Black", sans-serif';
      ctx.fillText(banner.title, W / 2, H * 0.52);
      ctx.fillStyle = '#e8fbff';
      ctx.font = '800 11px Nunito, system-ui, sans-serif';
      ctx.fillText(banner.sub.toUpperCase() + ' · ' + diff().label.toUpperCase(), W / 2, H * 0.52 + 20);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- loop ----------
  function update(dt) {
    if (state === 'play') {
      if (keys.ArrowLeft) angle = Math.min(MAX_A, angle + 1.8 * dt);
      if (keys.ArrowRight) angle = Math.max(MIN_A, angle - 1.8 * dt);
      if (shot) stepShot(dt);
      if (banner) { banner.t += dt; if (banner.t > 1.8) banner = null; }
    }
    if (state === 'paused') return;
    rowAnim = Math.max(0, rowAnim - ROW_H * dt * 6);
    for (const f of falling) { f.vy += 1500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; }
    falling = falling.filter(f => f.y < H + R);
    for (const e of effects) {
      e.t += dt;
      if (e.kind === 'drop' && e.t > 0) { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 300 * dt; }
    }
    effects = effects.filter(e => e.t < 0.5);
    for (const p of popups) p.t += dt;
    popups = popups.filter(p => p.t < 0.9);
    if (!reduceMotion) {
      for (const a of ambient) {
        a.y -= a.s * dt;
        if (a.y < -5) { a.y = H + 5; a.x = Math.random() * W; }
      }
    }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    if (sprites.length) draw(now / 1000);
    requestAnimationFrame(frame);
  }

  // ---------- input ----------
  function toLogical(e) {
    const r = cv.getBoundingClientRect();
    return { x: ((e.clientX - r.left) * W) / r.width, y: ((e.clientY - r.top) * H) / r.height };
  }
  function aimAt(p) {
    const a = Math.atan2(Math.max(SHOOT_Y - p.y, 1), p.x - SHOOT_X);
    angle = Math.min(MAX_A, Math.max(MIN_A, a));
  }

  cv.addEventListener('pointerdown', e => {
    if (state !== 'play') return;
    const p = toLogical(e);
    if ((p.x - NEXT_X) ** 2 + (p.y - NEXT_Y) ** 2 < 26 ** 2) { swap(); return; }
    pointerDown = true;
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    aimAt(p);
  });
  cv.addEventListener('pointermove', e => {
    if (state !== 'play') return;
    if (e.pointerType === 'mouse' || pointerDown) aimAt(toLogical(e));
  });
  cv.addEventListener('pointerup', e => {
    if (!pointerDown) return;
    pointerDown = false;
    const p = toLogical(e);
    if (p.y < SHOOT_Y - 10) { aimAt(p); fire(); }
  });
  cv.addEventListener('pointercancel', () => { pointerDown = false; });

  addEventListener('keydown', e => {
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') {
      if (state === 'play') { pause(); e.preventDefault(); return; }
      if (state === 'paused' && !$('scr-pause').hidden) { resume(); e.preventDefault(); return; }
    }
    if (state !== 'play') return;
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { keys[e.key] = true; e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'ArrowUp') { fire(); e.preventDefault(); }
    else if (e.key === 'x' || e.key === 'X') swap();
  });
  addEventListener('keyup', e => { keys[e.key] = false; });

  new ResizeObserver(resize).observe(cv);

  // ---------- boot (keeps a game in progress across page updates) ----------
  window.claude?.hot?.snapshot?.(() => ({ grid, parity, score, level, misses, cur, next, state, diffKey, levelColors }));

  function start(data) {
    syncSettingsUI();
    if (data && Array.isArray(data.grid) && (data.state === 'play' || data.state === 'paused') && DIFFS[data.diffKey]) {
      ({ grid, parity, score, level, misses, cur, next, diffKey, levelColors } = data);
      state = 'paused';
      updateHud();
      showScreen('pause');
    } else {
      generateLevel(); // a random reef behind the main menu
      cur = pickColor(); next = pickColor();
      state = 'menu';
      updateHud();
      showScreen('main');
    }
    resize();
